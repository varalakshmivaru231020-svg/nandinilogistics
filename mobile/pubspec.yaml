name: nninfra
description: NN Infra ERP — Android client.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  # Where a site log was written. The web fills its two hidden inputs from the
  # browser's geolocation; a phone standing on the site is the better
  # instrument, and the record shows the position either way.
  geolocator: ^13.0.2
  # Picking a document to attach — an Aadhaar copy, a drawing, a photograph.
  file_picker: ^8.1.6
  image_picker: ^1.1.2
  open_filex: ^4.5.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  # The media type of a multipart part; `http`'s own dependency, named here
  # because this package imports it directly.
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled, not fetched.
  #
  # google_fonts downloads at runtime, which fails in a test and — far worse —
  # fails on a site with no signal, where the app would quietly fall back to
  # the system face and lose the design's typography altogether. These are the
  # exact weights the canvas uses and nothing else.
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-600.ttf
          weight: 600
        - asset: assets/fonts/Sora-700.ttf
          weight: 700
        - asset: assets/fonts/Sora-800.ttf
          weight: 800
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-400.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-500.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-600.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-700.ttf
          weight: 700
